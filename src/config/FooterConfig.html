<!--
  在这里添加自定义的页脚 HTML 内容（例如 ICP 备案号、公安备案图标与链接、自定义声明等）。
  需要在 src/config/footerConfig.ts 中保持 enable: true；
  内容将注入在页脚版权信息上方；若文件留空或仅保留注释，则不会产生任何额外的 DOM 结构。
  注意：注释块会被构建期剥离，不会输出到页面。
-->
<div style="text-align:center;font-size:0.85em;opacity:0.75;">
  本站已运行 <span id="site-days">…</span> 天
</div>
<script>
  // 开站日期，按需修改
  const siteStart = new Date("2026-01-01").getTime();
  // 每次现查元素：桌面页脚在 Swup 容器内会被整块替换，不能缓存引用
  const updateSiteDays = () => {
    const el = document.getElementById("site-days");
    if (el) {
      el.textContent = String(
        Math.max(0, Math.floor((Date.now() - siteStart) / 86400000)),
      );
    }
  };
  // Swup 切页后容器内脚本不会重新执行，靠 document 级事件刷新新插入的节点
  document.addEventListener("swup:content:replace", updateSiteDays);
  if (!window.__siteDaysTimer) {
    updateSiteDays();
    window.__siteDaysTimer = setInterval(updateSiteDays, 3600000);
  } else {
    updateSiteDays();
  }
</script>
